name: Ping Supabase

on:
  schedule:
    - cron: '0 8 */4 * *'  # A cada 4 dias às 8h UTC (evita pausa de 7 dias)
  workflow_dispatch:        # Permite rodar manualmente pelo GitHub

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping banco de dados
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://wwdlntucbfzvtpfalmgg.supabase.co/rest/v1/clientes?select=cpf&limit=1" \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind3ZGxudHVjYmZ6dnRwZmFsbWdnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwNjA2MzksImV4cCI6MjA5NjYzNjYzOX0.2XR3w3_zfAVCXMNydYs56v-dbN-zuDC0-zwGUO0c2nk" \
            -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind3ZGxudHVjYmZ6dnRwZmFsbWdnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwNjA2MzksImV4cCI6MjA5NjYzNjYzOX0.2XR3w3_zfAVCXMNydYs56v-dbN-zuDC0-zwGUO0c2nk")
          echo "Status HTTP: $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "Supabase ativo"
          else
            echo "Aviso: resposta inesperada ($STATUS)"
            exit 1
          fi
